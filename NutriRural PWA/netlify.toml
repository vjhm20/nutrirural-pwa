# NutriRural - configuracion de despliegue en Netlify
# El sitio es estatico: la PWA vive en app/ y funciona sin backend.
# La sincronizacion con la API FastAPI es opcional y se configura
# desde Configuracion -> URL del servidor/API dentro de la aplicacion.

[build]
  publish = "app"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Robots-Tag = "noindex, nofollow"

# El service worker nunca se cachea: asi cada despliegue se propaga.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
